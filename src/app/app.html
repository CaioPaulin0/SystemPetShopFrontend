<header class="appHeader">
  <div class="appHeaderContent">
    <div class="brandBlock">
      <img class="brandMark" src="assets/logo.png" alt="" aria-hidden="true" width="42" height="42">
      <div class="brandText">
        <span class="appEyebrow">Gestão pet shop</span>
        <h1>System Pet Shop</h1>
      </div>
    </div>

    <nav class="appTabs" aria-label="Navegação principal" role="tablist" aria-orientation="vertical">
      <button
        type="button"
        role="tab"
        id="cadastro-tab"
        class="appTab"
        [class.active]="activeTab === 'cadastro'"
        [attr.aria-selected]="activeTab === 'cadastro'"
        aria-controls="cadastro-panel"
        aria-label="Cadastro"
        (click)="selectTab('cadastro')"
      >
        <img src="assets/produtos.png" alt="" aria-hidden="true">
        <span class="tabLabel">Cadastro</span>
      </button>

      <button
        type="button"
        role="tab"
        id="vencimento-tab"
        class="appTab"
        [class.active]="activeTab === 'vencimento'"
        [attr.aria-selected]="activeTab === 'vencimento'"
        aria-controls="vencimento-panel"
        aria-label="Vencimento"
        (click)="selectTab('vencimento')"
      >
        <img src="assets/vencimento.png" alt="" aria-hidden="true">
        <span class="tabLabel">Vencimento</span>
      </button>

      <button
        type="button"
        role="tab"
        id="metricas-tab"
        class="appTab"
        [class.active]="activeTab === 'metricas'"
        [attr.aria-selected]="activeTab === 'metricas'"
        aria-controls="metricas-panel"
        aria-label="Métricas"
        (click)="selectTab('metricas')"
      >
        <img src="assets/metricas.png" alt="" aria-hidden="true">
        <span class="tabLabel">Métricas</span>
      </button>
    </nav>
  </div>
</header>

<main>
  <section
    *ngIf="activeTab === 'cadastro'"
    id="cadastro-panel"
    role="tabpanel"
    aria-labelledby="cadastro-tab"
  >
    <app-main-component></app-main-component>
  </section>

  <section
    *ngIf="activeTab === 'vencimento'"
    id="vencimento-panel"
    role="tabpanel"
    aria-labelledby="vencimento-tab"
  >
    <app-vencimento-component></app-vencimento-component>
  </section>

  <section
    *ngIf="activeTab === 'metricas'"
    id="metricas-panel"
    role="tabpanel"
    aria-labelledby="metricas-tab"
  >
    <app-metrics-component></app-metrics-component>
  </section>
</main>

<router-outlet />
